workflows:
  ios-staging:
    name: iOS Staging Build (TestFlight)
    max_build_duration: 60
    environment:
      flutter: 3.32.4
      groups:
        - ios_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.contestlive.contestLive
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Select staging Firebase configuration
        script: cp ios/Runner/GoogleService-Info-Staging.plist ios/Runner/GoogleService-Info.plist
      - name: Build iOS release (Staging)
        script: >-
          flutter build ios --release --no-codesign
          --build-name=1.0.0 --build-number=34 --dart-define=ENV=staging
      - name: Package into IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner || (cat /tmp/xcodebuild_logs/*.log && exit 1)
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "The staging IPA was not created."
            exit 1
          fi
          CHECK_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$CHECK_DIR"
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleVersion' \
            "$CHECK_DIR/Payload/Mlivecast.app/Info.plist")"
          if [ "$ACTUAL_BUILD_NUMBER" != "34" ]; then
            echo "Expected build number 34; IPA contains $ACTUAL_BUILD_NUMBER."
            exit 1
          fi
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ihebmechergui333@gmail.com
        notify:
          success: true
          failure: true

  ios-build:
    name: iOS Build (Production)
    max_build_duration: 60
    environment:
      flutter: 3.32.4
      groups:
        - ios_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.contestlive.contestLive
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build iOS release
        script: flutter build ios --release --no-codesign --dart-define=ENV=prod
      - name: Package into IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner || (cat /tmp/xcodebuild_logs/*.log && exit 1)
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ihebmechergui333@gmail.com
        notify:
          success: true
          failure: true

  android-build:
    name: Android Release Build (.aab)
    max_build_duration: 60
    environment:
      flutter: 3.32.4
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build Android App Bundle (.aab)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - ihebmechergui333@gmail.com
        notify:
          success: true
          failure: true
