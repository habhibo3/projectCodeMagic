workflows:
  ios-staging:
    name: iOS Staging Build (TestFlight)
    max_build_duration: 60
    environment:
      flutter: 3.32.4
      groups:
        - ios_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.contestlive.contestLive
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Select staging Firebase configuration
        script: |
          set -e
          cp ios/Runner/GoogleService-Info-Staging.plist \
            ios/Runner/GoogleService-Info.plist
          PROJECT_ID=$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' \
            ios/Runner/GoogleService-Info.plist)
          if [ "$PROJECT_ID" != "mlivecast-staging" ]; then
            echo "Staging build selected unexpected Firebase project: $PROJECT_ID"
            exit 1
          fi
      - name: Build iOS release (Staging)
        script: >-
          flutter build ios --release --no-codesign
          --build-name=1.0.0 --dart-define=ENV=staging
          --dart-define=EXPECTED_FIREBASE_PROJECT_ID=mlivecast-staging
      - name: Verify staging Dart environment
        script: |
          python3 - <<'PY'
          import base64
          import pathlib
          import sys

          config = pathlib.Path('ios/Flutter/Generated.xcconfig').read_text()
          line = next(
              (item for item in config.splitlines()
               if item.startswith('DART_DEFINES=')),
              None,
          )
          if line is None:
              sys.exit('DART_DEFINES is missing from Generated.xcconfig.')

          encoded_values = line.split('=', 1)[1].strip().strip('"').split(',')
          defines = {
              base64.b64decode(value + '=' * (-len(value) % 4)).decode()
              for value in encoded_values if value
          }
          required = {
              'ENV=staging',
              'EXPECTED_FIREBASE_PROJECT_ID=mlivecast-staging',
          }
          missing = required - defines
          if missing:
              sys.exit('Missing staging Dart defines: ' + ', '.join(sorted(missing)))
          print('Verified staging Dart defines and Firebase project.')
          PY
      - name: Package into IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner || (cat /tmp/xcodebuild_logs/*.log && exit 1)
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "The staging IPA was not created."
            exit 1
          fi
          CHECK_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$CHECK_DIR"
          APP_BUNDLE="$(find "$CHECK_DIR/Payload" -maxdepth 2 \
            -type d -name '*.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "The IPA does not contain an iOS app bundle."
            exit 1
          fi
          APP_PLIST="$APP_BUNDLE/GoogleService-Info.plist"
          if [ ! -f "$APP_PLIST" ]; then
            echo "The IPA does not contain GoogleService-Info.plist."
            exit 1
          fi
          IPA_PROJECT_ID=$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' \
            "$APP_PLIST")
          if [ "$IPA_PROJECT_ID" != "mlivecast-staging" ]; then
            echo "Expected staging Firebase in IPA; found $IPA_PROJECT_ID."
            exit 1
          fi
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleVersion' \
            "$APP_BUNDLE/Info.plist")"
          EXPECTED_BUILD_NUMBER="$(sed -nE \
            's/^version:.*\+([0-9]+)$/\1/p' pubspec.yaml)"
          if [ -z "$EXPECTED_BUILD_NUMBER" ]; then
            echo "Could not read the build number from pubspec.yaml."
            exit 1
          fi
          if [ "$ACTUAL_BUILD_NUMBER" != "$EXPECTED_BUILD_NUMBER" ]; then
            echo "Expected build number $EXPECTED_BUILD_NUMBER; IPA contains $ACTUAL_BUILD_NUMBER."
            exit 1
          fi
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path build/ios/ipa/Mlivecast.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ihebmechergui333@gmail.com
        notify:
          success: true
          failure: true

  ios-build:
    name: iOS Build (Production)
    max_build_duration: 60
    environment:
      flutter: 3.32.4
      groups:
        - ios_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.contestlive.contestLive
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build iOS release
        script: >-
          flutter build ios --release --no-codesign
          --dart-define=ENV=prod
          --dart-define=EXPECTED_FIREBASE_PROJECT_ID=contest-app-94050
      - name: Package into IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner || (cat /tmp/xcodebuild_logs/*.log && exit 1)
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - ihebmechergui333@gmail.com
        notify:
          success: true
          failure: true

  android-build:
    name: Android Release Build (.aab)
    max_build_duration: 60
    environment:
      flutter: 3.32.4
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build Android App Bundle (.aab)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - ihebmechergui333@gmail.com
        notify:
          success: true
          failure: true
